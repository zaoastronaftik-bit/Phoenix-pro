name: Phoenix Loader 5.2 Premium APK

on:
  push:
    branches:
      - ci/phoenix-loader-v5-2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Unpack Phoenix Premium Gradle project
        run: tar -xJf .ci/phoenix-loader-v5.2.tar.xz

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          echo "Using SDK manager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install 'platforms;android-33' 'build-tools;33.0.2'

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Phoenix Premium APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixLoader-5.2-premium-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
