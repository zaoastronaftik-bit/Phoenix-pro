name: Phoenix Loader 5.1 APK

on:
  push:
    branches:
      - ci/phoenix-loader-v5-1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Unpack Phoenix Loader 5.1 Gradle project
        run: tar -xJf .ci/phoenix-loader-v5.1.tar.xz

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager --install 'platforms;android-33' 'build-tools;33.0.2'

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Phoenix Loader APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixLoader-5.1-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
